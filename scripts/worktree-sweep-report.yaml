# Checked-in record of the recurring half of the worktree sweep (#0049), kept
# byte-identical to the armed copy at .mycolab/workflows/ in the main checkout.
#
# It REPORTS and never deletes: the step runs sweep_agent_worktrees.py with
# --notify, which the script refuses to combine with --apply, and delivers the
# candidate list to the head session. Removal stays a human decision. A workflow
# step's stdout reaches nobody, so a tick that only printed would have reported
# nothing at all.
#
# Two things here are deliberate. The step reads the script out of `origin/main`
# rather than off the working tree, because the main checkout can sit a hundred
# commits behind and the watcher must run the landed code. And when that read
# fails it SAYS SO to the head session instead of exiting quietly -- a watcher
# whose command vanished otherwise fails in a way that reads as a clean pass.
#
# Install (from anywhere inside the repo; `myco workflow add` also arms it, and
# refuses a step that cannot run, so the else-branch is what makes it
# installable before the branch lands):
#
#   myco workflow add worktree-sweep-report --on schedule --cron '37 7 * * *' --run '<the run: line below, verbatim>'
#
# `add` binds the workflow to the CALLING session; rewrite `session:` to the head
# session afterwards or it dies with whichever child installed it. Then verify it
# is armed, not merely present on disk:
#
#   myco workflow show worktree-sweep-report
#   python3 -c "import json,os;print('worktree-sweep-report' in json.load(open(os.path.expanduser('~/.myco/.mycolab/.workflow-armed-names'))))"
name: worktree-sweep-report
session: nice-bird-njonwf
on:
  schedule:
  - cron: 37 7 * * *
jobs:
  run:
    steps:
    - run: 'set -e; d="$HOME/.cache/bioengine-worktree-sweep"; mkdir -p "$d"; git -C /data/nmechtel/bioengine fetch -q origin; if git -C /data/nmechtel/bioengine show origin/main:scripts/sweep_agent_worktrees.py > "$d/sweep.py" 2>/dev/null; then timeout 900 python3 "$d/sweep.py" --notify nice-bird-njonwf; else myco session send nice-bird-njonwf --subject "worktree sweep could not run" "scripts/sweep_agent_worktrees.py is not on origin/main yet, so the worktree/session sweep reported nothing this tick. It starts working by itself once the #0049 branch merges."; fi'
