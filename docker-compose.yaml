# Template docker-compose.yaml for BioEngine with data server and single-machine worker mode.
services:
  data-server:
    image: ghcr.io/aicell-lab/bioengine-datasets:${BIOENGINE_VERSION:-latest}
    container_name: bioengine-data-server
    user: "${UID}:${GID}"
    volumes:
      - ${HOME}/.bioengine:/home/.bioengine
      - ${DATA_DIR}:/data
    environment:
      - HOME=/home
      - TZ=UTC
    command: >
      python -m bioengine.datasets
      --data-dir /data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:39527/health/liveness"]
      start_period: 60s
      start_interval: 5s
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: ghcr.io/aicell-lab/bioengine-worker:${BIOENGINE_VERSION:-latest}
    container_name: bioengine-worker
    user: "${UID}:${GID}"
    shm_size: 8g
    # Ray sizes its memory monitor from min(cgroup limit, host total), so without
    # this it budgets against the whole machine and only sheds its own tasks at
    # 95% of it — past the point the kernel's OOM killer acts, and the kernel
    # picks Ray's workers first because Ray marks them oom_score_adj 1000.
    #
    # Must stay ABOVE --head-memory-in-gb below: that is a Ray *scheduling
    # reservation*, not a cap, so a limit under it makes Ray hand out work it
    # cannot fit. 42g = 30 reserved + 8 shared memory + 4 overhead.
    mem_limit: 42g
    volumes:
      - ${HOME}/.bioengine:/home/.bioengine
    environment:
      - HOME=/home
      - HYPHA_TOKEN=${HYPHA_TOKEN}
      - TZ=UTC
    command: >
      python -m bioengine.worker
      --worker-name "My BioEngine Worker"
      --mode single-machine
      --head-num-cpus 4
      --head-num-gpus 1
      --head-memory-in-gb 30
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
