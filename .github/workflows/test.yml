name: Tests

# No `paths:` filter on purpose. This check is required by ruleset 8130154, and a
# required check that is skipped by a path filter never reports at all — the PR
# sits on "Expected — waiting for status" forever instead of passing.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-tests:
    name: check-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The datasets extra carries zarr>=3.0.8 and the worker extra carries
      # aiortc, without which tests/conftest.py's validate_environment fixture
      # pytest.exit()s before the worker tests run.
      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cli,datasets,worker,dev]"

      # tests/apps/cellpose/test_ui_e2e.py needs playwright, which no extra
      # declares and which would pull a browser download into every run.
      - name: Run the test suite
        run: |
          python -m pytest tests \
            --ignore=tests/apps/cellpose/test_ui_e2e.py \
            -p no:cacheprovider \
            --junitxml=junit.xml \
            --tb=short -q

      # A run that collected nothing reports no failures, which looks exactly
      # like a pass. Read the count out of the JUnit report rather than pytest's
      # summary line, which the dependency deprecation wall can crowd out.
      - name: Assert the suite actually ran
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          FLOOR = 1000
          try:
              root = ET.parse("junit.xml").getroot()
          except (OSError, ET.ParseError) as e:
              sys.exit(f"REFUSE: no readable JUnit report, so nothing attests a run: {e}")
          suites = root.findall("testsuite") or [root]
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          bad = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          ran = total - skipped
          print(f"collected={total} skipped={skipped} ran={ran} failures+errors={bad}")
          if ran < FLOOR:
              sys.exit(f"REFUSE: {ran} tests ran, below the floor of {FLOOR}")
          if bad:
              sys.exit(f"REFUSE: {bad} test(s) failed or errored")
          print(f"OK: {ran} tests ran, {bad} failures")
          PY
