name: Smart Microscopy Assistant
id: smart-microscopy-assistant
id_emoji: "🔬"
description: "VLM-backed microscopy assistant. Define re-usable visual tests with a few positive and negative reference images, then run them against new images to get a PASSED / FAILED / UNSURE verdict, or describe an image with a free-text instruction. Serves a choice of 4-bit NF4 backends from Qwen2.5-VL-7B up to Qwen3-VL-32B, selected per deployment with SMA_MODEL; each one books only the GPU memory it needs."
