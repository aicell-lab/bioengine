name: Federated U-Net
id: federated-unet
id_emoji: "🤝"
description: One site of a federated segmentation experiment. Each deployment downloads its own dataset into its replica, trains a small U-Net locally, and exchanges only state_dict bytes with the other sites through a Hypha artifact. Every payload crossing the site boundary is recorded with a sha256 digest so the "no image left the site" claim can be checked rather than asserted.
